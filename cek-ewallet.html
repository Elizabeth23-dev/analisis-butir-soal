<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cek E-Wallet &middot; Analisis Butir Soal</title>
<style>
  @font-face {
    font-family: 'Geist';
    src: url('assets/fonts/geist.woff2') format('woff2');
    font-weight: 100 900;
    font-display: swap;
  }
  @font-face {
    font-family: 'Geist Mono';
    src: url('assets/fonts/geist-mono.woff2') format('woff2');
    font-weight: 100 900;
    font-display: swap;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #060e24;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  main {
    flex: 1;
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
    padding: 24px 12px 56px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 20px 24px 28px;
    backdrop-filter: blur(12px);
  }

  /* ---- header inside card ---- */
  .card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  .card-header .icon {
    display: grid;
    place-items: center;
    width: 40px; height: 40px;
    border-radius: 12px;
    background: rgba(59,130,246,0.15);
    color: #93c5fd;
    border: 1px solid rgba(59,130,246,0.30);
  }
  .card-header .icon svg { width: 24px; height: 24px; }
  .card-header h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.3px;
    line-height: 1;
  }
  .card-header p {
    font-size: 12px;
    color: #94a3b8;
    margin-top: 4px;
  }

  /* ---- form ---- */
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block;
    font-size: 14px;
    font-weight: 500;
    color: #e2e8f0;
    margin-bottom: 6px;
  }
  .form-group label .req { color: #fca5a5; margin-left: 4px; }
  .form-group label .opt {
    font-size: 12px;
    font-style: italic;
    color: #64748b;
  }
  .input-wrap {
    position: relative;
  }
  .input-wrap .input-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: #64748b;
    pointer-events: none;
    display: flex;
  }
  .input-wrap .input-icon svg { width: 16px; height: 16px; }
  .input-wrap select,
  .input-wrap input {
    width: 100%;
    padding: 12px 12px 12px 40px;
    background: #0a1130;
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 12px;
    color: #fff;
    font-size: 14px;
    font-family: inherit;
    appearance: none;
    -webkit-appearance: none;
  }
  .input-wrap select { cursor: pointer; padding-right: 36px; }
  .input-wrap .chevron {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: #64748b;
    pointer-events: none;
  }
  .input-wrap select:focus,
  .input-wrap input:focus {
    outline: none;
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59,130,246,0.25);
  }
  .input-wrap input::placeholder,
  .input-wrap select option[value=""] {
    color: #475569;
  }
  select option {
    background: #0a1130;
    color: #fff;
  }

  .btn-submit {
    width: 100%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(to right, #3b82f6, #60a5fa);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: filter 0.15s;
    box-shadow: 0 10px 30px -10px rgba(59,130,246,0.6);
  }
  .btn-submit:hover { filter: brightness(1.1); }
  .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-submit svg { width: 16px; height: 16px; }

  .back-link {
    display: flex;
    justify-content: center;
    margin-top: 16px;
  }
  .back-link a {
    font-size: 12px;
    color: #64748b;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .back-link a:hover { color: #e2e8f0; }
  .back-link a svg { width: 14px; height: 14px; }

  /* ---- response panel ---- */
  .response-panel {
    background: #04081a;
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 460px;
  }
  .response-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.10);
    background: #070d22;
  }
  .dots { display: flex; gap: 6px; }
  .dots span {
    width: 12px; height: 12px;
    border-radius: 50%;
  }
  .dots .d-red { background: #ef4444; }
  .dots .d-yellow { background: #fbbf24; }
  .dots .d-green { background: #34d399; }
  .response-bar .tags { display: flex; align-items: center; gap: 8px; }
  .tag {
    font-family: 'Geist Mono', monospace;
    font-size: 10px;
    padding: 4px 8px;
    border-radius: 6px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .tag-method {
    background: rgba(59,130,246,0.15);
    color: #93c5fd;
    border: 1px solid rgba(59,130,246,0.30);
  }
  .tag-json {
    background: rgba(148,163,184,0.10);
    color: #94a3b8;
    border: 1px solid rgba(255,255,255,0.10);
  }
  .copy-btn {
    background: none;
    border: none;
    color: #64748b;
    cursor: pointer;
    padding: 4px;
    display: flex;
  }
  .copy-btn:hover { color: #fff; }
  .copy-btn svg { width: 16px; height: 16px; }
  .response-body {
    flex: 1;
    padding: 20px;
    font-family: 'Geist Mono', monospace;
    font-size: 13px;
    line-height: 1.7;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .response-body .placeholder {
    color: rgba(52,211,153,0.65);
  }
  .response-footer {
    display: flex;
    align-items: center;
    padding: 8px 16px;
    border-top: 1px solid rgba(255,255,255,0.10);
    background: #070d22;
    font-family: 'Geist Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    gap: 8px;
  }
  .status-label { color: #64748b; }
  .status-value { font-weight: 600; }
  .status-idle { color: #64748b; }
  .status-loading { color: #fbbf24; }
  .status-success { color: #34d399; }
  .status-error { color: #ef4444; }
  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    display: inline-block;
  }
  .status-dot.idle { background: #64748b; }
  .status-dot.loading { background: #fbbf24; animation: blink 1s infinite; }
  .status-dot.ok { background: #34d399; }
  .status-dot.err { background: #ef4444; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* json syntax highlighting */
  .json-key { color: #93c5fd; }
  .json-str { color: #86efac; }
  .json-num { color: #fde68a; }
  .json-bool { color: #c4b5fd; }
  .json-null { color: #94a3b8; }
  .json-brace { color: #e2e8f0; }

  /* ---- footer ---- */
  footer {
    text-align: center;
    padding: 20px 16px;
    font-size: 12px;
    color: #475569;
    display: flex;
    justify-content: center;
    gap: 16px;
  }
  footer a {
    color: #64748b;
    text-decoration: none;
  }
  footer a:hover { color: #e2e8f0; }

  /* ---- spinner ---- */
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.15);
    border-top-color: #3b82f6;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-right: 6px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- toggle api key visibility ---- */
  .toggle-vis {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #64748b;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 8px;
    display: grid;
    place-items: center;
  }
  .toggle-vis:hover { color: #fff; background: rgba(255,255,255,0.05); }
  .toggle-vis svg { width: 16px; height: 16px; }

  @media (max-width: 860px) {
    .grid {
      grid-template-columns: 1fr;
    }
    .response-panel { min-height: 320px; }
  }
</style>
</head>
<body>

<script src="nav.js"></script>

<main>
  <div class="grid">

    <!-- LEFT: Form Card -->
    <div class="card">
      <div class="card-header">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M3 10h18" stroke="currentColor" stroke-width="1.8"/><circle cx="17" cy="14.5" r="1.2" fill="currentColor"/></svg>
        </span>
        <div>
          <h1>CEK E-WALLET</h1>
          <p>Verifikasi data akun e-wallet via API</p>
        </div>
      </div>

      <form id="ewallet-form">
        <div class="form-group">
          <label>Pilih E-Wallet<span class="req">*</span></label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.6"/></svg>
            </span>
            <select id="ewallet-code" required>
              <option value="">Pilih E-Wallet</option>
              <option value="all">ALL (cek semua e-wallet)</option>
              <option value="wallet_ovo">OVO</option>
              <option value="wallet_dana">DANA</option>
              <option value="wallet_linkaja">LinkAja</option>
              <option value="gopay_user">Gopay</option>
              <option value="gopay_driver">Gopay Driver</option>
              <option value="grab_user">Grab User</option>
              <option value="wallet_shopeepay">ShopeePay</option>
              <option value="wallet_isaku">i.saku</option>
              <option value="wallet_astrapay">AstraPay</option>
              <option value="qris">QRIS</option>
            </select>
            <span class="chevron">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
          </div>
        </div>

        <div class="form-group">
          <label>Nomor HP<span class="req">*</span></label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A15 15 0 0 1 3 6a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
            </span>
            <input type="text" id="phone-number" placeholder="Contoh: 081234567890" required />
          </div>
        </div>

        <div class="form-group">
          <label><span>API Key</span> <span class="opt">(Opsional)</span></label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none"><circle cx="8" cy="12" r="4" stroke="currentColor" stroke-width="1.6"/><path d="m12 12 8 0M16 12v3M19 12v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </span>
            <input type="password" id="api-key" placeholder="MOCHI_xxxxxxxxxxxxxxxxxxx" autocomplete="off" spellcheck="false" style="padding-right:44px" />
            <button type="button" class="toggle-vis" id="toggle-key" aria-label="Tampilkan API key" title="Tampilkan">
              <svg viewBox="0 0 24 24" fill="none" id="eye-icon"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">
          Kirim Data
          <svg viewBox="0 0 24 24" fill="none"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>

      <div class="back-link">
        <a href="index.html">
          <svg viewBox="0 0 24 24" fill="none"><path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Kembali ke daftar kalkulator
        </a>
      </div>
    </div>

    <!-- RIGHT: Response Panel -->
    <div class="response-panel">
      <div class="response-bar">
        <div class="dots">
          <span class="d-red"></span>
          <span class="d-yellow"></span>
          <span class="d-green"></span>
        </div>
        <div class="tags">
          <span class="tag tag-method">METHOD-POST</span>
          <span class="tag tag-json">JSON RESPONSE</span>
          <button type="button" class="copy-btn" id="copy-btn" title="Copy response">
            <svg viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M5 15V6a2 2 0 0 1 2-2h9" stroke="currentColor" stroke-width="1.6"/></svg>
          </button>
        </div>
      </div>
      <div class="response-body" id="response-body">
        <span class="placeholder">// Menunggu input dari form&hellip;</span>
      </div>
      <div class="response-footer">
        <span class="status-label">STATUS:</span>
        <span class="status-dot idle" id="status-dot"></span>
        <span class="status-value status-idle" id="status-text">IDLE</span>
      </div>
    </div>

  </div>
</main>

<footer>
  <span>Cek E-Wallet &mdash; Analisis Butir Soal</span>
</footer>

<script>
(function () {
  var API_URL = 'https://api-mochi.vercel.app/api/check-ewallet';

  var form         = document.getElementById('ewallet-form');
  var submitBtn    = document.getElementById('submit-btn');
  var responseBody = document.getElementById('response-body');
  var statusDot    = document.getElementById('status-dot');
  var statusText   = document.getElementById('status-text');
  var copyBtn      = document.getElementById('copy-btn');
  var toggleKey    = document.getElementById('toggle-key');
  var apiKeyInput  = document.getElementById('api-key');

  var lastJson = '';

  // toggle API key visibility
  toggleKey.addEventListener('click', function () {
    var isPassword = apiKeyInput.type === 'password';
    apiKeyInput.type = isPassword ? 'text' : 'password';
    toggleKey.title = isPassword ? 'Sembunyikan' : 'Tampilkan';
  });

  // copy response
  copyBtn.addEventListener('click', function () {
    if (!lastJson) return;
    navigator.clipboard.writeText(lastJson).then(function () {
      copyBtn.title = 'Copied!';
      setTimeout(function () { copyBtn.title = 'Copy response'; }, 1500);
    });
  });

  function setStatus(type, text) {
    statusDot.className = 'status-dot ' + type;
    statusText.className = 'status-value status-' + type;
    statusText.textContent = text;
  }

  // syntax-highlight JSON
  function highlightJson(obj, indent) {
    indent = indent || 0;
    var pad = '  '.repeat(indent);
    var pad1 = '  '.repeat(indent + 1);

    if (obj === null) return '<span class="json-null">null</span>';
    if (typeof obj === 'boolean') return '<span class="json-bool">' + obj + '</span>';
    if (typeof obj === 'number') return '<span class="json-num">' + obj + '</span>';
    if (typeof obj === 'string')
      return '<span class="json-str">"' + escapeHtml(obj).replace(/\n/g, '\\n') + '"</span>';

    if (Array.isArray(obj)) {
      if (obj.length === 0) return '<span class="json-brace">[]</span>';
      var items = obj.map(function (v) {
        return pad1 + highlightJson(v, indent + 1);
      });
      return '<span class="json-brace">[</span>\n' + items.join(',\n') + '\n' + pad + '<span class="json-brace">]</span>';
    }

    var keys = Object.keys(obj);
    if (keys.length === 0) return '<span class="json-brace">{}</span>';
    var entries = keys.map(function (k) {
      return pad1 + '<span class="json-key">"' + escapeHtml(k) + '"</span>: ' + highlightJson(obj[k], indent + 1);
    });
    return '<span class="json-brace">{</span>\n' + entries.join(',\n') + '\n' + pad + '<span class="json-brace">}</span>';
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    var ewalletCode = document.getElementById('ewallet-code').value;
    var phoneNumber = document.getElementById('phone-number').value.trim();
    var apiKey      = document.getElementById('api-key').value.trim();

    if (!ewalletCode || !phoneNumber) return;

    // show loading
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span> Memproses\u2026';
    responseBody.innerHTML = '<span class="placeholder">// Mengirim request\u2026</span>';
    setStatus('loading', 'LOADING');

    var body = {
      ewallet_code: ewalletCode,
      phone_number: phoneNumber
    };
    if (apiKey) body.api_key = apiKey;

    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      lastJson = JSON.stringify(data, null, 2);
      responseBody.innerHTML = highlightJson(data);
      if (data.success) {
        setStatus('ok', data.status_code ? data.status_code + ' OK' : '200 OK');
      } else {
        setStatus('err', data.status_code ? data.status_code + ' ERROR' : 'ERROR');
      }
    })
    .catch(function (err) {
      var errData = { success: false, message: 'Network error: ' + err.message };
      lastJson = JSON.stringify(errData, null, 2);
      responseBody.innerHTML = highlightJson(errData);
      setStatus('err', 'NETWORK ERROR');
    })
    .finally(function () {
      submitBtn.disabled = false;
      submitBtn.innerHTML = 'Kirim Data <svg viewBox="0 0 24 24" fill="none" style="width:16px;height:16px"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    });
  });
})();
</script>

</body>
</html>
